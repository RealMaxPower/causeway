<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-label="A clay tablet covered in cuneiform marks on the left; a small coin on the right; an arrow points from tablet to coin across millennia.">
  <defs>
    <linearGradient id="cw-clay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8c4a0"/>
      <stop offset="100%" stop-color="#a98a5e"/>
    </linearGradient>
    <linearGradient id="cw-coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c264"/>
      <stop offset="100%" stop-color="#a07a23"/>
    </linearGradient>
    <pattern id="cw-cuneiform" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M2 4 L7 2 L4 6 Z" fill="#5b4422" opacity="0.55"/>
      <path d="M9 9 L12 11 L9 12 Z" fill="#5b4422" opacity="0.45"/>
      <path d="M3 11 L6 10 L4 13 Z" fill="#5b4422" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Clay tablet -->
  <g transform="translate(28 32)">
    <rect x="0" y="0" width="140" height="156" rx="14" ry="14" fill="url(#cw-clay)" stroke="#6e5223" stroke-width="1.5"/>
    <rect x="10" y="10" width="120" height="136" rx="8" ry="8" fill="url(#cw-cuneiform)"/>
    <text x="70" y="178" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" letter-spacing="0.12em" fill="#5b4422" text-transform="uppercase">~3000 BCE</text>
  </g>

  <!-- Arrow across the gap -->
  <g transform="translate(178 100)" stroke="#a07a23" stroke-width="1.5" fill="none">
    <line x1="0" y1="0" x2="48" y2="0" stroke-dasharray="4 4"/>
    <polyline points="42,-5 48,0 42,5"/>
  </g>
  <text x="202" y="92" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-style="italic" font-size="11" fill="#7a5a1a">~2,300 years</text>

  <!-- Coin -->
  <g transform="translate(238 64)">
    <circle cx="46" cy="46" r="46" fill="url(#cw-coin)" stroke="#6e4d12" stroke-width="1.5"/>
    <circle cx="46" cy="46" r="38" fill="none" stroke="#6e4d12" stroke-width="0.6" stroke-dasharray="2 3" opacity="0.55"/>
    <text x="46" y="52" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-style="italic" font-size="28" font-weight="600" fill="#3a2806">L</text>
    <text x="46" y="124" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" letter-spacing="0.12em" fill="#5b4422" text-transform="uppercase">~700 BCE</text>
  </g>
</svg>

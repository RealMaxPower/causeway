name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Catch slow link rot independent of PR cadence — once a week, Sunday 06:00 UTC.
  schedule:
    - cron: "0 6 * * 0"
  # Allow running the source-URL audit on demand.
  workflow_dispatch:

# Cancel superseded runs on the same branch to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default for every job: read-only access to the repo.
# Every job here only reads / lints / audits — none need write access to
# contents, packages, or any other scope.
permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6 # pnpm version comes from "packageManager" in package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        # Clear stale Next.js generated validator that can lag a new route addition.
        run: |
          rm -f .next/dev/types/validator.ts
          pnpm typecheck

  build-corpus-drift:
    name: Search corpus is in sync with MDX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6 # pnpm version comes from "packageManager" in package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate corpus
        run: pnpm build:corpus

      - name: Fail if corpus drifted
        run: |
          if ! git diff --exit-code lib/search-corpus.generated.ts; then
            echo "::error::lib/search-corpus.generated.ts is out of sync with content/nodes/*.mdx."
            echo "::error::Run 'pnpm build:corpus' locally and commit the result."
            exit 1
          fi

  check-links:
    name: Internal link integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6 # pnpm version comes from "packageManager" in package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify every /nodes/<id>, Cite id, and Sources.ids resolves
        run: pnpm check:links

  check-sources:
    name: Source URLs resolve
    runs-on: ubuntu-latest
    # External URL rot is time-based, not commit-based, and anti-bot hosts
    # return contradictory 403/404s that flake on every push. Run only on the
    # weekly cron (and manual dispatch), and keep it non-blocking.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6 # pnpm version comes from "packageManager" in package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: HEAD-check every URL in lib/sources.ts
        run: pnpm check:sources

  audit:
    name: OSV vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # `pnpm audit` is dead: npm retired the audit endpoints it calls (they
      # return HTTP 410 in every pnpm version), so it can no longer scan
      # anything. OSV-Scanner reads pnpm-lock.yaml directly and queries the OSV
      # database (which aggregates GitHub's GHSA advisories), needing no npm
      # audit endpoint. This scans the whole locked tree (dev + prod, all
      # severities) — a stricter gate than the old prod-only/high+ filter.
      # Action pinned to a commit SHA (v2.3.8) for supply-chain safety.
      - name: OSV-Scanner (fail on any known vulnerability)
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # playwright.config.ts builds the app and serves it with `next start`, so
    # the specs run against the production output. Needs no secrets.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6 # pnpm version comes from "packageManager" in package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cache what the next step downloads: the browsers (per Playwright
      # version) and the system packages they need (per runner OS). The step
      # normally takes under a minute, but a slow Ubuntu mirror once
      # stretched the package download to 14 minutes.
      - name: Resolve Playwright cache keys
        id: pw
        run: |
          echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
          echo "image=$ImageOS" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Cache Playwright system packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/playwright-debs
          key: playwright-debs-${{ steps.pw.outputs.image }}-${{ steps.pw.outputs.version }}

      # Chromium for the desktop specs, WebKit for the iPhone 13 mobile spec.
      # Cached .deb files go into apt's archive so apt skips downloading them.
      - name: Install Playwright browsers and system dependencies
        env:
          BROWSERS_CACHED: ${{ steps.pw-browsers.outputs.cache-hit }}
        run: |
          debs="$HOME/.cache/playwright-debs"
          mkdir -p "$debs"
          echo 'APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99keep-debs > /dev/null
          if compgen -G "$debs/*.deb" > /dev/null; then
            sudo cp "$debs"/*.deb /var/cache/apt/archives/
          fi
          if [ "$BROWSERS_CACHED" = "true" ]; then
            pnpm exec playwright install-deps chromium webkit
          else
            pnpm exec playwright install --with-deps chromium webkit
          fi
          cp /var/cache/apt/archives/*.deb "$debs"/ 2>/dev/null || true
          echo "Cached system packages: $(find "$debs" -name '*.deb' | wc -l) files, $(du -sh "$debs" | cut -f1)"

      # Serve /compare from the bundled World Bank snapshot so the specs don't
      # depend on the live API being fast from GitHub's runners. This also
      # runs the snapshot-badge spec, which skips without it.
      - name: Run E2E
        run: pnpm e2e
        env:
          WORLDBANK_OFFLINE: "1"

      # Traces are recorded on the first retry (see playwright.config.ts).
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
